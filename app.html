<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FUKASHIGI APP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- ヘッダー -->
<header class="app-header">
  <div class="logo">FUKASHIGI</div>
  <div class="header-actions">
    <span id="headerUserName" style="font-size:12px;color:var(--text-muted);letter-spacing:0.04em;font-family:'Inter',sans-serif;"></span>
    <button class="btn btn-outline btn-sm" onclick="doLogout()">ログアウト</button>
  </div>
</header>

<!-- メインコンテンツ（通常タブ用） -->
<div class="main-content">

  <!-- ===== HOME ===== -->
  <div id="tab-home" class="tab-section active">

    <!-- ユーザーカード -->
    <div class="user-card">
      <div class="avatar">👤</div>
      <div class="user-info">
        <div class="user-name" id="homeUserName">…</div>
        <div class="user-rank-row" id="homeRankRow"></div>
      </div>
    </div>

    <!-- スタッツ（3列） -->
    <div class="stats-row">
      <div class="stat-box gold-val">
        <div class="stat-val" id="statPoints">—</div>
        <div class="stat-label">ポイント</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statCheckins">—</div>
        <div class="stat-label">来店回数</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statChips">—</div>
        <div class="stat-label">チップ</div>
      </div>
    </div>

    <!-- チェックインボタン -->
    <div class="checkin-btn-wrap">
      <button class="checkin-btn" id="checkinBtn" onclick="openQRScanner()">
        <span class="icon">📷</span> QRチェックイン
      </button>
      <div id="checkinStatus" style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:10px;font-family:'Inter',sans-serif;"></div>
    </div>

    <!-- 今日の来店メンバー -->
    <div class="section-title">今日の来店</div>
    <div class="today-members-scroll" id="todayMembers">
      <div style="font-size:13px;color:var(--text-muted);padding:8px 0;">読み込み中…</div>
    </div>

    <!-- お知らせ -->
    <div class="section-title">お知らせ</div>
    <div id="homeNotices">
      <div class="loading"><div class="spinner"></div> 読み込み中…</div>
    </div>

    <!-- 直近のイベント -->
    <div class="section-title">次回イベント</div>
    <div id="homeEvents">
      <div class="loading"><div class="spinner"></div> 読み込み中…</div>
    </div>

  </div><!-- /tab-home -->

  <!-- ===== EVENTS ===== -->
  <div id="tab-events" class="tab-section">
    <div class="page-title">イベント</div>

    <div class="tag-filter">
      <button class="tag-btn active" onclick="filterEvents('all',this)">すべて</button>
      <button class="tag-btn" onclick="filterEvents('poker',this)">ポーカー</button>
      <button class="tag-btn" onclick="filterEvents('smash',this)">スマブラ</button>
      <button class="tag-btn" onclick="filterEvents('fishing',this)">釣り</button>
      <button class="tag-btn" onclick="filterEvents('card',this)">カード</button>
      <button class="tag-btn" onclick="filterEvents('other',this)">その他</button>
    </div>

    <div id="eventsList">
      <div class="loading"><div class="spinner"></div> 読み込み中…</div>
    </div>
  </div><!-- /tab-events -->

  <!-- ===== RANKING ===== -->
  <div id="tab-ranking" class="tab-section">
    <div class="page-title">ランキング</div>

    <!-- ランキング種別タブ -->
    <div class="tag-filter" id="rankingTypeFilter">
      <button class="tag-btn active" onclick="switchRankingType('points', this)">ポイント</button>
      <button class="tag-btn" onclick="switchRankingType('checkins', this)">来店回数</button>
      <button class="tag-btn" onclick="switchRankingType('events', this)">イベント参加</button>
    </div>

    <div id="rankingList">
      <div class="loading"><div class="spinner"></div> 読み込み中…</div>
    </div>
  </div><!-- /tab-ranking -->

  <!-- ===== MYPAGE ===== -->
  <div id="tab-mypage" class="tab-section">

    <!-- プロフィールヘッダー -->
    <div class="profile-header">
      <div class="avatar" id="mypageAvatar">👤</div>
      <div class="profile-name" id="mypageName"></div>
      <div class="profile-id" id="mypageMemberNo"></div>
      <div class="profile-rank-row" id="mypageRankRow"></div>
    </div>

    <!-- ステータス詳細 -->
    <div class="section-title" style="margin-top:0;">ステータス</div>
    <div class="detail-list">
      <div class="detail-row">
        <span class="label">現在ポイント</span>
        <span class="value gold" id="mypagePoints">—</span>
      </div>
      <div class="detail-row">
        <span class="label">累計ポイント</span>
        <span class="value" id="mypageTotalPoints">—</span>
      </div>
      <div class="detail-row">
        <span class="label">チップ</span>
        <span class="value" id="mypageChips">—</span>
      </div>
      <div class="detail-row">
        <span class="label">来店回数</span>
        <span class="value" id="mypageCheckins">—</span>
      </div>
      <div class="detail-row">
        <span class="label">イベント参加数</span>
        <span class="value" id="mypageEventJoins">—</span>
      </div>
    </div>

    <!-- バッジ -->
    <div class="section-title">バッジ</div>
    <div class="badge-grid" id="mypageBadges"></div>

    <!-- ポイント履歴 -->
    <div class="section-title">ポイント履歴</div>
    <div id="mypagePointLogs">
      <div class="loading"><div class="spinner"></div> 読み込み中…</div>
    </div>

  </div><!-- /tab-mypage -->

</div><!-- /main-content -->

<!-- ===== CHAT（固定フルスクリーンレイアウト） ===== -->
<div id="tab-chat" class="tab-section chat-layout">
  <div class="chat-inner">
    <div class="chat-room-header">
      <div class="chat-room-title">💬 全体チャット</div>
      <div class="chat-room-badge" id="chatOnlineCount"></div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="loading"><div class="spinner"></div> 読み込み中…</div>
    </div>
    <div class="chat-input-bar">
      <input
        type="text"
        class="form-input"
        id="chatInput"
        placeholder="メッセージを入力…"
        maxlength="400"
        autocomplete="off"
      >
      <button class="btn btn-gold btn-sm" onclick="sendMessage()" style="flex-shrink:0;">送信</button>
    </div>
  </div>
</div>

<!-- ボトムナビ（5タブ） -->
<nav class="bottom-nav">
  <button class="nav-item active" id="nav-home" onclick="switchTab('home')">
    <span class="nav-icon">🏠</span>
    <span>ホーム</span>
  </button>
  <button class="nav-item" id="nav-events" onclick="switchTab('events')">
    <span class="nav-icon">📅</span>
    <span>イベント</span>
  </button>
  <button class="nav-item" id="nav-chat" onclick="switchTab('chat')">
    <span class="nav-icon">💬</span>
    <span>チャット</span>
  </button>
  <button class="nav-item" id="nav-ranking" onclick="switchTab('ranking')">
    <span class="nav-icon">🏆</span>
    <span>ランキング</span>
  </button>
  <button class="nav-item" id="nav-mypage" onclick="switchTab('mypage')">
    <span class="nav-icon">👤</span>
    <span>マイページ</span>
  </button>
</nav>

<!-- QRスキャナーモーダル -->
<div class="modal-overlay" id="qrModal">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">QRチェックイン</div>
      <button class="modal-close" onclick="closeQRScanner()">✕</button>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px;line-height:1.7;">
      会場に掲示されているQRコードをスキャンしてください
    </p>
    <div class="qr-scanner-wrap">
      <div id="qr-reader"></div>
      <div class="qr-corner-overlay">
        <div class="qr-corners">
          <span class="qr-corner tl"></span>
          <span class="qr-corner tr"></span>
          <span class="qr-corner bl"></span>
          <span class="qr-corner br"></span>
        </div>
      </div>
    </div>
    <div id="qrMessage" style="text-align:center;font-size:14px;padding:14px;display:none;font-weight:700;border-radius:8px;"></div>
    <button class="btn btn-outline btn-block" onclick="closeQRScanner()">閉じる</button>
  </div>
</div>

<!-- イベント詳細モーダル -->
<div class="modal-overlay" id="eventModal">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="eventModalTitle"></div>
      <button class="modal-close" onclick="closeEventModal()">✕</button>
    </div>
    <div id="eventModalContent"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
