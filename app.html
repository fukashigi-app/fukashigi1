<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FUKASHIGI APP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- ヘッダー -->
<header class="app-header">
  <div class="logo">FUKASHIGI</div>
  <div class="header-actions">
    <span id="headerUserName" style="font-size:12px;color:var(--text-muted);letter-spacing:0.04em;font-family:'Inter',sans-serif;"></span>
    <button class="btn btn-outline btn-sm" onclick="doLogout()">ログアウト</button>
  </div>
</header>

<!-- メインコンテンツ -->
<div class="main-content">

  <!-- ===== HOME ===== -->
  <div id="tab-home" class="tab-section active">

    <!-- ユーザーカード -->
    <div class="user-card">
      <div class="avatar" id="homeAvatar" style="overflow:hidden;">👤</div>
      <div class="user-info">
        <div class="user-name" id="homeUserName">…</div>
      </div>
    </div>

    <!-- スタッツ（ポイントのみ） -->
    <div id="homeStats" style="margin-bottom:16px;">
      <div class="stat-box gold-val">
        <div class="stat-val" id="statPoints">—</div>
        <div class="stat-label">所持ポイント</div>
      </div>
    </div>

    <!-- 管理者ページボタン（管理者のみ表示） -->
    <div id="adminPageBtn" style="display:none;margin-bottom:14px;text-align:center;">
      <a href="admin.html" class="btn btn-gold" style="display:inline-flex;gap:8px;padding:10px 24px;font-size:14px;">
        <span>⚙</span> 管理者ページ
      </a>
    </div>

    <!-- チェックインボタン -->
    <div class="checkin-btn-wrap">
      <button class="checkin-btn" id="checkinBtn" onclick="openQRScanner()">
        <span class="icon">📷</span> QRチェックイン
      </button>
      <div id="checkinStatus" style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:10px;font-family:'Inter',sans-serif;"></div>
    </div>

    <!-- 今日の来店メンバー -->
    <div class="section-title">今日の来店</div>
    <div id="todayMembersWrap">
      <div class="today-members-scroll" id="todayMembers">
        <div style="font-size:13px;color:var(--text-muted);padding:8px 0;">読み込み中…</div>
      </div>
    </div>

    <!-- お知らせ -->
    <div class="section-title">お知らせ</div>
    <div id="homeNotices"></div>

    <!-- 直近のイベント -->
    <div class="section-title">次回イベント</div>
    <div id="homeEvents"></div>

  </div><!-- /tab-home -->

  <!-- ===== EVENTS ===== -->
  <div id="tab-events" class="tab-section">
    <div class="page-title">イベント</div>

    <!-- カレンダー -->
    <div class="cal-wrap">
      <div class="cal-header">
        <button class="cal-nav" onclick="calPrev()">&#8249;</button>
        <div class="cal-month-label" id="calMonthLabel"></div>
        <button class="cal-nav" onclick="calNext()">&#8250;</button>
      </div>
      <div class="cal-grid-head">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <!-- 日別イベント一覧 -->
    <div class="section-title" style="margin-top:20px;" id="eventsDayTitle">イベント一覧</div>
    <div id="eventsDayList"></div>
  </div><!-- /tab-events -->

  <!-- ===== CHAT ===== -->
  <div id="tab-chat" class="tab-section">
    <div class="page-title" style="margin-bottom:14px;">チャット</div>

    <div id="chatMessages" class="chat-messages-list"></div>

    <div class="chat-input-area">
      <textarea class="chat-input" id="chatInput" placeholder="メッセージを入力…" rows="1"
        onkeydown="chatKeyDown(event)" oninput="autoResizeChatInput(this)"></textarea>
      <button class="chat-send-btn" id="chatSendBtn" onclick="sendChatMessage()">↑</button>
    </div>
  </div><!-- /tab-chat -->

  <!-- ===== MYPAGE ===== -->
  <div id="tab-mypage" class="tab-section">

    <!-- プロフィールヘッダー -->
    <div class="profile-header">
      <div class="avatar-wrap" onclick="openEditProfile()">
        <div class="avatar" id="mypageAvatar" style="overflow:hidden;">👤</div>
        <div class="avatar-edit-badge">✏</div>
      </div>
      <div class="profile-name" id="mypageName"></div>
      <button class="btn btn-outline btn-sm" onclick="openEditProfile()" style="margin-top:14px;">
        プロフィール編集
      </button>
    </div>

    <!-- 自己紹介 -->
    <div id="mypageBioWrap" style="padding:0 4px 16px;font-size:13px;color:var(--text-sub);line-height:1.8;display:none;"></div>

    <!-- 所持ポイント -->
    <div class="section-title" style="margin-top:0;">所持ポイント</div>
    <div class="stat-box gold-val" style="margin-bottom:16px;">
      <div class="stat-val" id="mypagePoints">—</div>
      <div class="stat-label">POINTS</div>
    </div>

  </div><!-- /tab-mypage -->

</div><!-- /main-content -->

<!-- ボトムナビ（4タブ） -->
<nav class="bottom-nav">
  <button class="nav-item active" id="nav-home" onclick="switchTab('home')">
    <span class="nav-icon">🏠</span>
    <span>ホーム</span>
  </button>
  <button class="nav-item" id="nav-events" onclick="switchTab('events')">
    <span class="nav-icon">📅</span>
    <span>イベント</span>
  </button>
  <button class="nav-item" id="nav-chat" onclick="switchTab('chat')">
    <span class="nav-icon">💬</span>
    <span>チャット</span>
  </button>
  <button class="nav-item" id="nav-mypage" onclick="switchTab('mypage')">
    <span class="nav-icon">👤</span>
    <span>マイページ</span>
  </button>
</nav>

<!-- QRスキャナーモーダル -->
<div class="modal-overlay" id="qrModal">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">QRチェックイン</div>
      <button class="modal-close" onclick="closeQRScanner()">✕</button>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px;line-height:1.7;">
      会場に掲示されているQRコードをスキャンしてください
    </p>
    <div class="qr-scanner-wrap">
      <div id="qr-reader"></div>
      <div class="qr-corner-overlay">
        <div class="qr-corners">
          <span class="qr-corner tl"></span>
          <span class="qr-corner tr"></span>
          <span class="qr-corner bl"></span>
          <span class="qr-corner br"></span>
        </div>
      </div>
    </div>
    <div id="qrMessage" style="text-align:center;font-size:14px;padding:14px;display:none;font-weight:700;border-radius:8px;"></div>
    <button class="btn btn-outline btn-block" onclick="closeQRScanner()">閉じる</button>
  </div>
</div>

<!-- イベント詳細モーダル -->
<div class="modal-overlay" id="eventModal">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="eventModalTitle"></div>
      <button class="modal-close" onclick="closeEventModal()">✕</button>
    </div>
    <div id="eventModalContent"></div>
  </div>
</div>

<!-- プロフィール編集モーダル -->
<div class="modal-overlay" id="editProfileModal">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">プロフィール編集</div>
      <button class="modal-close" onclick="closeEditProfile()">✕</button>
    </div>

    <!-- プロフィール写真 -->
    <div class="form-group" style="text-align:center;margin-bottom:16px;">
      <label class="form-label" style="display:block;text-align:left;margin-bottom:10px;">プロフィール写真</label>
      <div id="profileImagePreview"
           style="width:76px;height:76px;border-radius:50%;margin:0 auto 12px;overflow:hidden;background:var(--bg-card2);display:flex;align-items:center;justify-content:center;font-size:34px;border:2px solid var(--border);cursor:pointer;"
           onclick="document.getElementById('profileImageInput').click()">
        👤
      </div>
      <label class="btn btn-outline btn-sm" style="cursor:pointer;display:inline-block;margin-bottom:4px;">
        写真をアップロード
        <input type="file" id="profileImageInput" accept="image/*" style="display:none;" onchange="handleProfileImageChange(event)">
      </label>
      <p style="font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.6;">JPG / PNG / WebP（最大5MB）</p>
    </div>

    <!-- または絵文字から選択 -->
    <div class="section-title" style="margin-top:0;">または絵文字から選択</div>
    <div class="icon-picker-grid" id="iconPickerGrid"></div>

    <div class="form-group" style="margin-top:16px;">
      <label class="form-label">表示名</label>
      <input type="text" class="form-input" id="editName" maxlength="20" placeholder="名前を入力してください">
    </div>

    <div class="form-group">
      <label class="form-label">自己紹介文</label>
      <textarea class="form-textarea" id="editBio" maxlength="200" placeholder="自己紹介を入力してください（200文字以内）" style="min-height:80px;"></textarea>
    </div>

    <button class="btn btn-gold btn-block" id="saveProfileBtn" onclick="saveProfile()">保存する</button>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
